# GECRAI 1.2 - Staging Environment Configuration
# FASE 0: Security Foundation - Staging Deployment
#
# IMPORTANTE: Este archivo usa variables de entorno externas.
# Crear archivo .env.staging antes de deploy:
#   cp .env.staging.example .env.staging
#   Editar .env.staging con valores reales
#
# Deploy command:
#   docker-compose -f docker-compose.staging.yml up -d

version: '3.8'

services:
  # PostgreSQL Database - Staging
  db:
    image: postgres:15-alpine
    container_name: gecrai-staging-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-gecrai_staging}
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    networks:
      - gecrai-staging
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    # No expone puerto público - solo accesible internamente

    # Redis Cache - Staging
  redis:
    image: redis:7-alpine
    container_name: gecrai-staging-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_staging_data:/data
    networks:
      - gecrai-staging
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    # No expone puerto público - solo accesible internamente

    # Backend API - Staging
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gecrai-staging-backend
    restart: unless-stopped
    environment:
      # Critical: Must be set in .env.staging
      - ENVIRONMENT=production
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY}

      # Database
      - DATABASE_URL=${DATABASE_URL}

      # Redis
      - REDIS_URL=${REDIS_URL}

      # Security
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}

      # CORS - Staging domain only
      - CORS_ORIGINS=${CORS_ORIGINS}

      # Proxy Settings (if behind load balancer)
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES}

      # Rate Limiting
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-60}

      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks:
      - gecrai-staging
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # NO expone puerto directamente - debe pasar por proxy
    # El proxy (nginx/traefik) manejará HTTPS y redirigirá a este servicio
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --access-log --error-log --proxy-headers --forwarded-allow-ips='*'

volumes:
  postgres_staging_data:
    driver: local
  redis_staging_data:
    driver: local

networks:
  gecrai-staging:
    driver: bridge
    internal: false
